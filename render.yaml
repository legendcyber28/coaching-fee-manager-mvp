services:
  - type: web
    name: coaching-fee-manager-mvp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm run db:seed && npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: DATABASE_URL
        value: file:./dev.db
      - key: ADMIN_EMAIL
        value: demo@abc-coaching.example
      - key: ADMIN_PASSWORD
        value: DemoFeeManager2026!
      - key: INSTITUTE_NAME
        value: ABC Coaching Demo
      - key: SESSION_SECRET
        generateValue: true
