services:
  - type: web
    name: coaching-fee-manager-mvp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: APP_URL
        value: https://coaching-fee-manager-mvp.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INSTITUTE_NAME
        value: ABC Coaching
      - key: SESSION_SECRET
        generateValue: true
