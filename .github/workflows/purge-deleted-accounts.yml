name: Purge deleted Fee Manager accounts
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Request retryable purge
        env:
          PURGE_JOB_SECRET: ${{ secrets.PURGE_JOB_SECRET }}
          FEE_APP_ORIGIN: ${{ vars.FEE_APP_ORIGIN }}
        run: |
          test -n "$FEE_APP_ORIGIN" || { echo 'Missing FEE_APP_ORIGIN'; exit 1; }
          test -n "$PURGE_JOB_SECRET" || { echo 'Missing PURGE_JOB_SECRET'; exit 1; }
          curl --fail --show-error --silent --max-time 110 --retry 2 --retry-delay 5 \
            -X POST "${FEE_APP_ORIGIN%/}/api/maintenance/purge" \
            -H "Authorization: Bearer $PURGE_JOB_SECRET"
